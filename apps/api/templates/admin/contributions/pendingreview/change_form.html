{% extends "admin/change_form.html" %}

{% block object-tools-items %}
  {% if original.is_pending %}
    <li><a href="{% url 'admin:contributions_pendingcontribution_approve' original.pk %}" style="background:#2E7D32;color:white">✓ Approve &amp; publish</a></li>
    <li><a href="{% url 'admin:contributions_pendingcontribution_reject' original.pk %}" style="background:#DC3545;color:white">✗ Reject</a></li>
  {% endif %}
  <li><a href="{% url 'admin:contributions_pendingcontribution_changelist' %}">Back to queue</a></li>
{% endblock %}
