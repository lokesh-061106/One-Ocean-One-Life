version: '3.8'

services:
  db:
    image: postgis/postgis:17-3.6
    container_name: o3l_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-o3l_prod}
      POSTGRES_USER: ${DB_USER:-o3l_user}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-o3l_user} -d ${DB_NAME:-o3l_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - o3l_network

  redis:
    image: redis:7-alpine
    container_name: o3l_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - o3l_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: o3l_api
    restart: always
    command: gunicorn o3l.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER:-o3l_user}:${DB_PASS:-changeme}@db:5432/${DB_NAME:-o3l_prod}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - o3l_network

  celery:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: o3l_celery
    restart: always
    command: celery -A o3l worker --loglevel=info --concurrency=2
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER:-o3l_user}:${DB_PASS:-changeme}@db:5432/${DB_NAME:-o3l_prod}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - o3l_network

  celery-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: o3l_celery_beat
    restart: always
    command: celery -A o3l beat --loglevel=info
    volumes:
      - ./apps/api:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER:-o3l_user}:${DB_PASS:-changeme}@db:5432/${DB_NAME:-o3l_prod}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - o3l_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: o3l_web
    restart: always
    command: npm start
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api/v1
      - API_URL=http://api:8000/api/v1
    networks:
      - o3l_network

  nginx:
    image: nginx:alpine
    container_name: o3l_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      - api
      - web
    networks:
      - o3l_network

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  o3l_network:
    driver: bridge
