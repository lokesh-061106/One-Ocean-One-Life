version: '3.8'

services:
  db:
    image: postgis/postgis:17-3.6
    container_name: o3l_db
    environment:
      POSTGRES_DB: o3l_dev
      POSTGRES_USER: o3l_user
      POSTGRES_PASSWORD: o3l_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o3l_user -d o3l_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: o3l_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: o3l_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATABASE_URL=postgis://o3l_user:o3l_password@db:5432/o3l_dev
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: o3l_celery
    command: celery -A o3l worker -l info
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATABASE_URL=postgis://o3l_user:o3l_password@db:5432/o3l_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: o3l_celery_beat
    command: celery -A o3l beat -l info
    volumes:
      - ./apps/api:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATABASE_URL=postgis://o3l_user:o3l_password@db:5432/o3l_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: o3l_web
    command: npm run dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

  nginx:
    image: nginx:alpine
    container_name: o3l_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/media
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  media_data:
